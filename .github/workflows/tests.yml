name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Demo sobre el proyecto vulnerable (debe salir con código 2 = críticos)
        run: |
          set +e
          python main.py --target ./test_project --logs ./test_project/logs --format json --quiet
          code=$?
          test "$code" -eq 2
